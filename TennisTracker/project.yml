name: TennisTracker
options:
  bundleIdPrefix: com.florianschneider
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: DEFYR9944A
    CODE_SIGN_STYLE: Automatic

targets:
  TennisTracker:
    type: application
    platform: iOS
    sources:
      - path: TennisTracker
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianschneider.SwingStream
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TennisTracker/Info.plist
      properties:
        CFBundleDisplayName: TennisTracker
        CFBundleName: TennisTracker
        NSLocalNetworkUsageDescription: "TennisTracker sendet Sensordaten an dein Mac-Dashboard im lokalen Netzwerk."
        NSCameraUsageDescription: "TennisTracker nimmt im Label-Modus ein Video auf, das mit den Sensordaten synchronisiert wird."
        NSMicrophoneUsageDescription: "TennisTracker nimmt im Label-Modus Video mit Ton auf."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
    dependencies:
      - target: TennisTracker Watch App
        embed: true

  TennisTracker Watch App:
    type: application
    platform: watchOS
    sources:
      - path: TennisTracker Watch App
      - path: Shared
    entitlements:
      path: TennisTracker Watch App/TennisTrackerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianschneider.SwingStream.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TennisTracker Watch App/Info.plist
      properties:
        CFBundleDisplayName: TennisTracker
        CFBundleName: TennisTracker
        NSMotionUsageDescription: "TennisTracker nutzt die Bewegungssensoren der Apple Watch zum Aufzeichnen der Schläge."
        NSHealthShareUsageDescription: "TennisTracker startet eine Trainingseinheit, damit die Sensoren auch bei ausgeschaltetem Display weiter aufzeichnen."
        NSHealthUpdateUsageDescription: "TennisTracker startet eine Trainingseinheit, damit die Sensoren auch bei ausgeschaltetem Display weiter aufzeichnen."
        WKApplication: true
        WKBackgroundModes:
          - workout-processing
        WKCompanionAppBundleIdentifier: com.florianschneider.SwingStream
