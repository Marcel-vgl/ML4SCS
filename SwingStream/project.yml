name: SwingStream
options:
  bundleIdPrefix: com.florianschneider
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # DEVELOPMENT_TEAM bleibt leer – in Xcode unter "Signing & Capabilities" setzen.
    CODE_SIGN_STYLE: Automatic

targets:
  SwingStream:
    type: application
    platform: iOS
    sources:
      - path: SwingStream
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianschneider.SwingStream
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: SwingStream/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "SwingStream sendet Sensordaten an dein Mac-Dashboard im lokalen Netzwerk."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    dependencies:
      - target: SwingStream Watch App
        embed: true

  SwingStream Watch App:
    type: application
    platform: watchOS
    sources:
      - path: SwingStream Watch App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florianschneider.SwingStream.watchkitapp
    info:
      path: SwingStream Watch App/Info.plist
      properties:
        NSMotionUsageDescription: "SwingStream nutzt die Bewegungssensoren der Apple Watch zum Aufzeichnen der Schläge."
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.florianschneider.SwingStream
